services:
  redis:
    image: redis:7-alpine
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-agenticnetsec}
      POSTGRES_USER: ${POSTGRES_USER:-agenticnetsec}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-agenticnetsec}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data

  migrate:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-agenticnetsec}:${POSTGRES_PASSWORD:-agenticnetsec}@postgres:5432/${POSTGRES_DB:-agenticnetsec}
      AGENTIC_DATABASE_REQUIRED: "1"
    command: ["python", "-m", "alembic", "upgrade", "head"]
    depends_on:
      postgres:
        condition: service_healthy

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-agenticnetsec}:${POSTGRES_PASSWORD:-agenticnetsec}@postgres:5432/${POSTGRES_DB:-agenticnetsec}
      REDIS_URL: redis://redis:6379/0
      AGENTIC_DATABASE_REQUIRED: "1"
      AGENTIC_CORS_ORIGINS: http://localhost:3000,http://127.0.0.1:3000
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    volumes:
      - app_outputs:/app/outputs
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health/database', timeout=3).read()\"",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-agenticnetsec}:${POSTGRES_PASSWORD:-agenticnetsec}@postgres:5432/${POSTGRES_DB:-agenticnetsec}
      REDIS_URL: redis://redis:6379/0
      AGENTIC_DATABASE_REQUIRED: "1"
    command: ["python", "backend/scripts/run_worker.py"]
    volumes:
      - app_outputs:/app/outputs
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8000}
    environment:
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8000}
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres_data:
  app_outputs:
